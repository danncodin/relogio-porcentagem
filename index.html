<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relógio de Porcentagem</title>
  <style>
    :root { --bg:#111; --card:#1a1a1a; --borda:#333; --mudo:#888; --verde:#4ade80; }
    body { margin:0; min-height:100vh; background:var(--bg); color:#fff; font-family:sans-serif;
           display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
           gap:32px; padding:16px; box-sizing:border-box; }
    button { font-family:inherit; cursor:pointer; }
    .relogio { display:flex; flex-direction:column; align-items:center; gap:12px; width:min(90vw,65vh,480px); }
    svg { width:100%; touch-action:none; }
    .alca { cursor:grab; stroke:var(--bg); stroke-width:3; }
    .painel { display:flex; flex-direction:column; gap:16px; width:280px; max-width:90vw; }
    .num { fill:#777; font-size:9px; }
    .num.forte { fill:#fff; font-size:11px; font-weight:bold; }
    #hora { font-variant-numeric:tabular-nums; }

    /* botões (tipo de dia, janelas e uso) */
    .btn { padding:9px 4px; border:1px solid var(--borda); border-radius:8px; background:var(--card);
           color:#aaa; font-size:14px; display:flex; flex-direction:column; gap:2px; align-items:center; }
    .btn small { font-size:11px; opacity:.85; }
    .btn.on { background:var(--c); color:#111; border-color:var(--c); }
    .linhaBtn { display:flex; gap:8px; width:100%; }
    .linhaBtn .btn { flex:1; }
    .rotuloBtn { font-size:11px; color:#666; align-self:flex-start; margin-bottom:-6px; }
    .usar { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .usar .btn { padding:10px 4px; border-color:#2f6b47; background:#14261c; color:var(--verde); }
    .usar .btn:active { background:#1d3a29; }
    .usar b { font-size:16px; }
    .usar small { color:#8fd7ad; }

    .card { background:var(--card); border-radius:10px; padding:12px 14px; }
    .card h3 { margin:0 0 8px; font-size:13px; color:var(--mudo); font-weight:normal; }
    .linha { display:flex; justify-content:space-between; padding:3px 0; font-size:18px; }
    .linha span:first-child { color:var(--mudo); }
    .legenda { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:#aaa; }
    .legenda i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }

    .total { font-size:14px; color:#aaa; margin-bottom:8px; }
    .total b { color:#fff; }
    #log { max-height:200px; overflow-y:auto; }
    .item { display:flex; justify-content:space-between; align-items:center;
            padding:5px 0; font-size:14px; border-top:1px solid #262626; }
    .item .hora { color:var(--mudo); font-variant-numeric:tabular-nums; }
    .item button, #limpar { background:none; border:none; color:#666; padding:0; }
    .item button { font-size:16px; }
    #limpar { margin-top:8px; font-size:12px; }
    .item button:hover, #limpar:hover { color:#f87171; }
    .vazio { color:#666; font-size:13px; }
  </style>
</head>
<body>
  <div class="relogio">
    <svg viewBox="-10 -10 320 320">
      <g id="grupo"></g>
      <g id="numeros"></g>
      <text id="pct" x="150" y="138" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="34"></text>
      <text id="rotulo" x="150" y="164" text-anchor="middle" fill="#888" font-size="11"></text>
      <text id="hora" x="150" y="186" text-anchor="middle" fill="#ccc" font-size="15"></text>
    </svg>

    <span class="rotuloBtn">Tipo de dia</span>
    <div class="linhaBtn" id="tipos"></div>
    <span class="rotuloBtn">Janelas (liga / desliga)</span>
    <div class="linhaBtn" id="toggles"></div>
  </div>

  <div class="painel">
    <div class="legenda" id="legenda"></div>

    <div class="card">
      <h3 id="tituloContador"></h3>
      <div id="contador"></div>
    </div>

    <div class="card">
      <h3 id="tituloUsar"></h3>
      <div class="usar" id="usar"></div>
    </div>

    <div class="card">
      <h3>Log de hoje</h3>
      <div class="total" id="total"></div>
      <div id="log"></div>
      <button id="limpar">limpar o log de hoje</button>
    </div>
  </div>

<script>
  /* ================= BÁSICO ================= */
  const C = 2 * Math.PI * 100;   // anel externo (dia)
  const CJ = 2 * Math.PI * 76;   // anel interno (janelas)
  const ROT = -142.5;            // -90 = meia-noite no topo
  const TESTE = null;            // número (ex.: 19.5) pra simular o horário
  const COR_TRAB = '#64748b';

  const el = id => document.getElementById(id);
  const svg = document.querySelector('svg');
  const mod24 = x => (x % 24 + 24) % 24;
  const pad = n => String(n).padStart(2, '0');
  const set = (id, attrs) => { const n = el(id); if (n) for (const k in attrs) n.setAttribute(k, attrs[k]); };
  const rot = h => `rotate(${h * 15} 150 150)`;

  const ler = (k, padrao) => { try { return JSON.parse(localStorage.getItem(k)) ?? padrao; } catch (e) { return padrao; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  const chaveDia = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hojeStr = () => chaveDia(new Date());
  const durJ = j => mod24(j.fim - j.inicio) || 24;
  const dentro = (h, ini, fim) => mod24(h - ini) < (mod24(fim - ini) || 24);
  const fmtMin = m => m < 10 ? m.toFixed(1).replace('.', ',') + ' min' : Math.round(m) + ' min';
  const fmtHoras = h => {
    const m = Math.round(h * 60);
    return m % 60 === 0 ? (m / 60) + 'h' : Math.floor(m / 60) + 'h' + pad(m % 60);
  };
  const horaAgora = () => {
    const d = new Date();
    return TESTE ?? (d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600);
  };

  /* ================= CONFIG: tipos de dia ================= */
  const PADRAO = {
    trabalho: {
      nome: 'Trabalho',
      sono: { dormir: 23, acordar: 6 },
      trab: { inicio: 10, fim: 17 },
      janelas: [
        { id: 'manha', nome: 'Manhã',              inicio: 7,  fim: 10, cor: '#fbbf24', on: true },
        { id: 'tarde', nome: 'Depois do trabalho', inicio: 17, fim: 22, cor: '#a78bfa', on: true },
      ],
    },
    fimsemana: {
      nome: 'Fim de semana',
      sono: { dormir: 0, acordar: 9 },
      trab: null,
      janelas: [{ id: 'dia', nome: 'Dia livre', inicio: 9, fim: 24, cor: '#2dd4bf', on: true }],
    },
    livre: {
      nome: 'Folga',
      sono: { dormir: 23, acordar: 7 },
      trab: null,
      janelas: [{ id: 'dia', nome: 'Dia livre', inicio: 7, fim: 23, cor: '#2dd4bf', on: true }],
    },
  };

  const CHAVE_CFG = 'relogio-cfg-v2';
  const salvo = ler(CHAVE_CFG, {});
  let cfg = salvo.tipos || JSON.parse(JSON.stringify(PADRAO));
  let manual = salvo.manual || null;
  const salvarCfg = () => guardar(CHAVE_CFG, { tipos: cfg, manual });

  // tipo do dia: automático pelo dia da semana, a menos que eu tenha trocado hoje
  const dow = new Date().getDay();
  let tipo = (manual && manual.dia === hojeStr() && cfg[manual.tipo])
    ? manual.tipo
    : ((dow === 0 || dow === 6) ? 'fimsemana' : 'trabalho');
  const T = () => cfg[tipo];

  /* ================= REFERÊNCIA ================= */
  // O que o relógio mede agora: janela atual (ou próxima), ou o tempo livre do dia / sono
  // se nenhuma janela estiver ligada.
  const dia = (chave, nome, dur, passou, rotulo) => ({
    tipo: 'dia', chave: `${tipo}|${chave}`, nome, dur, passou, rotulo,
    pct: Math.round(passou / dur * 100), titulo: `${nome} (${fmtHoras(dur)})`,
  });

  function referencia(h) {
    const t = T(), ons = t.janelas.filter(j => j.on);

    if (ons.length) {
      const j = ons.find(j => dentro(h, j.inicio, j.fim))
        || ons.slice().sort((a, b) => mod24(a.inicio - h) - mod24(b.inicio - h))[0];
      const dur = durJ(j);
      const passou = dentro(h, j.inicio, j.fim) ? mod24(h - j.inicio) : -mod24(j.inicio - h);
      return {
        tipo: 'janela', chave: `${tipo}|${j.id}|${j.inicio}|${j.fim}`,
        nome: j.nome, cor: j.cor, inicio: j.inicio, fim: j.fim, dur, passou,
        pct: Math.round(Math.max(passou, 0) / dur * 100),
        rotulo: passou >= 0 ? 'da janela ' + j.nome.toLowerCase()
                            : j.nome.toLowerCase() + ' começa em ' + fmtHoras(-passou),
        titulo: `${j.nome}: ${pad(Math.floor(j.inicio))}–${pad(Math.floor(j.fim))} (${fmtHoras(dur)})`,
      };
    }

    const { dormir, acordar } = t.sono;
    const durSono = mod24(acordar - dormir) || 24;
    if (dentro(h, dormir, acordar))
      return dia(`sono|${dormir}|${acordar}`, 'Sono', durSono, mod24(h - dormir), 'do sono');

    // tempo livre = acordado menos trabalho, contado minuto a minuto
    const ehLivre = m => !dentro(m / 60, dormir, acordar) && !(t.trab && dentro(m / 60, t.trab.inicio, t.trab.fim));
    const alvoMin = mod24(h - acordar) * 60;
    let total = 0, feito = 0;
    for (let k = 0; k < 1440; k++)
      if (ehLivre(mod24(acordar + k / 60) * 60)) { total++; if (k < alvoMin) feito++; }
    const trabalhando = t.trab && dentro(h, t.trab.inicio, t.trab.fim);
    return dia(`livre|${total}`, 'Tempo livre', total / 60, feito / 60,
               trabalhando ? 'do tempo livre · em trabalho' : 'do tempo livre do dia');
  }

  let ref = referencia(horaAgora());
  let ultimaChave = null;
  const minP = p => ref.dur * 60 * p / 100; // quanto vale p% do período atual

  /* ================= LOG ================= */
  const CHAVE_LOG = 'relogio-log';
  let log = ler(CHAVE_LOG, []);
  const salvarLog = () => guardar(CHAVE_LOG, log);

  function registrar(pct) {
    const agora = new Date();
    log.push({ id: agora.getTime(), quando: agora.toISOString(), pct, min: minP(pct), nome: ref.nome, tipo });
    salvarLog();
    desenharLog();
  }

  function desenharLog() {
    const doDia = log.filter(x => chaveDia(new Date(x.quando)) === hojeStr());
    const porNome = {};
    doDia.forEach(x => { const n = x.nome || 'Outro'; porNome[n] = (porNome[n] || 0) + x.pct; });

    el('total').innerHTML = doDia.length
      ? `Total: <b>${fmtMin(doDia.reduce((s, x) => s + x.min, 0))}</b>` +
        Object.keys(porNome).map(n => ` · ${n} <b>${porNome[n]}%</b>`).join('')
      : '';

    el('log').innerHTML = doDia.length
      ? doDia.slice().reverse().map(x => {
          const d = new Date(x.quando);
          return `<div class="item">
            <span><span class="hora">${pad(d.getHours())}:${pad(d.getMinutes())}</span>
              &nbsp; ${x.nome || ''} · ${x.pct}% → ${fmtMin(x.min)}</span>
            <button data-id="${x.id}" title="apagar">×</button>
          </div>`;
        }).join('')
      : '<div class="vazio">Nada registrado ainda.</div>';
  }

  /* ================= RELÓGIO ================= */
  const circ = (r, cor, w, extra = '') =>
    `<circle cx="150" cy="150" r="${r}" fill="none" stroke="${cor}" stroke-width="${w}" ${extra}/>`;
  const alca = (g, i, c, r, cor, raio) =>
    `<circle class="alca" data-g="${g}" data-i="${i}" data-c="${c}" cx="${150 + r}" cy="150" r="${raio}" fill="${cor}" />`;
  const btn = (attr, cor, on, html) =>
    `<button class="btn${on ? ' on' : ''}" ${attr} style="--c:${cor}">${html}</button>`;

  function arco(perim, id, inicio, dur) {
    const a = dur / 24 * perim;
    set(id, { 'stroke-dasharray': `${a} ${perim - a}`, 'stroke-dashoffset': -inicio / 24 * perim });
  }

  // objeto que uma alça controla
  const alvoDaAlca = a => {
    const t = T(), g = a.dataset.g;
    return g === 'sono' ? t.sono : g === 'trab' ? t.trab : t.janelas[Number(a.dataset.i)];
  };

  // números 0-23 em volta do relógio (fixos)
  el('numeros').innerHTML = Array.from({ length: 24 }, (_, h) => {
    const a = (h * 15 + ROT) * Math.PI / 180;
    return `<text x="${150 + 128 * Math.cos(a)}" y="${150 + 128 * Math.sin(a)}" text-anchor="middle"
             dominant-baseline="middle" class="${h % 6 ? 'num' : 'num forte'}">${h || '0/24'}</text>`;
  }).join('');

  // estrutura: só refaz ao trocar o tipo ou ligar/desligar janela
  function construir() {
    const t = T();
    let s = circ(100, '#222', 20) + circ(100, '#4ade80', 20) + circ(100, '#3b82f6', 20, 'id="a-sono"');
    if (t.trab) s += circ(100, COR_TRAB, 20, 'id="a-trab"');
    s += circ(76, '#1c1c1c', 16)
       + t.janelas.map((j, i) => circ(76, j.cor, 16, `id="j-${i}"`)).join('')
       + circ(76, '#fff', 16, 'id="prog"')
       + `<g id="ticks"></g>
          <g id="agora">
            <line x1="212" y1="150" x2="262" y2="150" stroke="#fff" stroke-width="2.5" />
            <circle cx="250" cy="150" r="7" fill="#fff" />
          </g>`;

    s += ['dormir', 'acordar'].map(c => alca('sono', 0, c, 100, '#3b82f6', 11)).join('');
    if (t.trab) s += ['inicio', 'fim'].map(c => alca('trab', 0, c, 100, COR_TRAB, 11)).join('');
    t.janelas.forEach((j, i) => {
      if (j.on) s += ['inicio', 'fim'].map(c => alca('j', i, c, 76, j.cor, 8)).join('');
    });

    set('grupo', { transform: `rotate(${ROT} 150 150)` });
    el('grupo').innerHTML = s;
    document.querySelectorAll('.alca').forEach(arrastavel);

    el('tipos').innerHTML = Object.keys(cfg).map(k => btn(`data-k="${k}"`, '#fff', k === tipo, cfg[k].nome)).join('');
    el('toggles').innerHTML = t.janelas.map((j, i) =>
      btn(`data-i="${i}"`, j.cor, j.on,
          `<span>${j.nome}</span><small>${pad(j.inicio)} → ${pad(j.fim)} · ${j.on ? 'ligada' : 'desligada'}</small>`)
    ).join('');

    const ponto = (cor, nome) => `<span><i style="background:${cor}"></i>${nome}</span>`;
    el('legenda').innerHTML = ponto('#3b82f6', 'Sono')
      + (t.trab ? ponto(COR_TRAB, 'Trabalho') : '')
      + ponto('#4ade80', 'Livre')
      + t.janelas.map(j => ponto(j.cor, j.nome)).join('');

    posicionar();
    ultimaChave = null;
  }

  // arcos e alças (roda também durante o arrastar)
  function posicionar() {
    const t = T();
    arco(C, 'a-sono', t.sono.dormir, mod24(t.sono.acordar - t.sono.dormir) || 24);
    if (t.trab) arco(C, 'a-trab', t.trab.inicio, durJ(t.trab));
    t.janelas.forEach((j, i) => {
      arco(CJ, 'j-' + i, j.inicio, durJ(j));
      set('j-' + i, { opacity: j.on ? 0.35 : 0.08 });
    });
    document.querySelectorAll('.alca').forEach(a =>
      a.setAttribute('transform', rot(alvoDaAlca(a)[a.dataset.c])));
  }

  // parte que só muda quando a referência muda
  function desenharRef() {
    if (ref.tipo === 'janela') {
      set('prog', { stroke: ref.cor });
      el('ticks').innerHTML = Array.from({ length: 11 }, (_, i) =>
        `<line x1="214" y1="150" x2="236" y2="150" stroke="#111" stroke-width="${i % 5 === 0 ? 2.5 : 1.2}"
          transform="${rot(ref.inicio + ref.dur * i / 10)}"/>`).join('');
    } else {
      set('prog', { 'stroke-dasharray': '0 ' + CJ });
      el('ticks').innerHTML = '';
    }
    el('tituloContador').textContent = ref.titulo;
    el('tituloUsar').textContent = 'Usei de: ' + ref.nome;
    el('contador').innerHTML = [1, 5, 10].map(p =>
      `<div class="linha"><span>${p}%</span><span>${fmtMin(minP(p))}</span></div>`).join('');
    el('usar').innerHTML = [1, 5, 10, 20].map(p =>
      `<button class="btn" data-p="${p}"><b>${p}%</b><small>${fmtMin(minP(p))}</small></button>`).join('');
  }

  function atualizar() {
    const h = horaAgora();
    ref = referencia(h);
    if (ref.chave !== ultimaChave) { ultimaChave = ref.chave; desenharRef(); }

    set('agora', { transform: rot(h) });
    if (ref.tipo === 'janela') {
      const a = Math.min(Math.max(ref.passou, 0), ref.dur) / 24 * CJ;
      set('prog', { 'stroke-dasharray': `${a} ${CJ - a}`, 'stroke-dashoffset': -ref.inicio / 24 * CJ });
    }

    el('pct').textContent = ref.pct + '%';
    el('rotulo').textContent = ref.rotulo;
    el('hora').textContent = TESTE !== null
      ? 'teste ' + fmtHoras(h)
      : new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  /* ================= INTERAÇÃO ================= */
  function horarioDoPonteiro(e) {
    const r = svg.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2);
    const dy = e.clientY - (r.top + r.height / 2);
    const graus = (Math.atan2(dy, dx) * 180 / Math.PI - ROT + 360) % 360;
    return mod24(Math.round(graus / 15 * 4) / 4); // trava de 15 em 15 min
  }

  function arrastavel(a) {
    a.addEventListener('pointerdown', e => a.setPointerCapture(e.pointerId));
    a.addEventListener('pointermove', e => {
      if (!a.hasPointerCapture(e.pointerId)) return;
      alvoDaAlca(a)[a.dataset.c] = horarioDoPonteiro(e);
      posicionar();
      atualizar();
    });
    a.addEventListener('pointerup', () => { salvarCfg(); construir(); atualizar(); });
  }

  // clique num botão: roda a ação com o botão e refaz o relógio
  const aoClicar = (id, acao) => el(id).addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) acao(b);
  });
  const refazer = () => { salvarCfg(); construir(); atualizar(); };

  aoClicar('tipos', b => { tipo = b.dataset.k; manual = { dia: hojeStr(), tipo }; refazer(); });
  aoClicar('toggles', b => { const j = T().janelas[Number(b.dataset.i)]; j.on = !j.on; refazer(); });
  aoClicar('usar', b => registrar(Number(b.dataset.p)));
  aoClicar('log', b => { log = log.filter(x => x.id !== Number(b.dataset.id)); salvarLog(); desenharLog(); });
  el('limpar').onclick = () => {
    log = log.filter(x => chaveDia(new Date(x.quando)) !== hojeStr());
    salvarLog();
    desenharLog();
  };

  construir();
  desenharLog();
  atualizar();
  setInterval(atualizar, 1000);
</script>
</body>
</html>
